[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laliga-predictor"
version = "0.1.0"
description = "Predicciones probabilísticas de LaLiga: Dixon-Coles + Elo + contexto (alineaciones, noticias, árbitro, clima, mercado)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "requests>=2.31",
  "feedparser>=6.0",
  "rapidfuzz>=3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
gbm = ["lightgbm>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
laliga = "laliga.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests lentos (modelos completos)"]

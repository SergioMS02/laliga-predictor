name: Reentrenamiento semanal

on:
  schedule:
    - cron: "41 4 * * 2"   # martes 04:41 UTC, tras la jornada
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laliga-data
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Alineaciones y árbitros de la temporada (ESPN)
        continue-on-error: true
        run: python -m laliga backfill-espn --seasons "$(python -c 'from laliga.data.results import current_season as c; print(c())')" -v

      - name: Backtest + reentrenar meta-modelo
        run: python -m laliga backtest -v && python -m laliga train

      - name: Recalibrar efecto de las bajas (si hay datos suficientes)
        continue-on-error: true
        run: python -m laliga calibrate-availability

      - name: Rendimiento real de las predicciones emitidas
        run: python -m laliga evaluate-live

      - name: Guardar
        run: |
          git config user.name "laliga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data predictions
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reentrenamiento $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash
          git push

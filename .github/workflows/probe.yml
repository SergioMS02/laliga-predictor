name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw10
          python3 - <<'PY' > raw10/out.txt 2>&1
          import requests, json
          s = requests.Session(); s.headers["User-Agent"] = "Mozilla/5.0"
          G = "https://gamma-api.polymarket.com"
          r = s.get(G + "/events", params={"slug": "lal-bar-rea-2026-10-25"}, timeout=30); js = r.json()
          json.dump(js, open("raw10/clasico.json", "w"))
          r = s.get(G + "/events", params={"series_id": "10193", "closed": "false", "limit": 100}, timeout=30); js2 = r.json()
          json.dump(js2, open("raw10/lal_open.json", "w"))
          print("open lal", len(js2), [e.get("slug") for e in js2][:40])
          r = s.get(G + "/events", params={"series_id": "10193", "closed": "true", "limit": 100, "order": "endDate", "ascending": "false"}, timeout=30); js3 = r.json()
          json.dump(js3[:60], open("raw10/lal_closed.json", "w"))
          print("closed lal", len(js3), [(e.get("slug"), round(e.get("volume") or 0)) for e in js3][:40])
          for slug in ["laliga-2027-champion-20260701200737375", "laliga-top-goalscorer-2026-27", "laliga-teams-relegated-2026-27", "laliga-team-to-qualify-for-the-2027-28-uefa-champions-league"]:
              r = s.get(G + "/events", params={"slug": slug}, timeout=30); json.dump(r.json(), open(f"raw10/{slug[:30]}.json", "w"))
          for u in [G + "/events?slug=lal-bar-rea-2026-10-25", "https://clob.polymarket.com/prices-history?interval=1d&market=1"]:
              r = s.get(u, headers={"Origin": "https://sergioms02.github.io"}, timeout=30)
              print("CORS", u, r.status_code, r.headers.get("access-control-allow-origin"))
          # clob price history for clasico first market token
          try:
              m = js[0]["markets"][0]; toks = json.loads(m["clobTokenIds"]); print("token", toks[0])
              r = s.get("https://clob.polymarket.com/prices-history", params={"market": toks[0], "interval": "max", "fidelity": 60}, timeout=30)
              print("hist", r.status_code, r.text[:500])
          except Exception as e:
              print("hist err", e)
          PY
          git config user.name probe; git config user.email probe@example.com
          git add raw10; git commit -qm probe-out10; git push origin HEAD:probe

name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw
          python3 - <<'PY'
          import requests, pathlib
          s = requests.Session(); s.headers["User-Agent"] = "Mozilla/5.0 (X11; Linux x86_64) laliga-predictor/0.1"
          out = pathlib.Path("raw2"); out.mkdir(exist_ok=True)
          for n, u in {"clubelo_fixtures.csv": "http://api.clubelo.com/Fixtures", "clubelo_day.csv": "http://api.clubelo.com/2026-10-25",
                       "clubelo_barca.csv": "http://api.clubelo.com/Barcelona",
                       "espn_w.json": "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.w.1/scoreboard",
                       "espn_copa.json": "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.copa_del_rey/scoreboard?dates=20261028"}.items():
              try:
                  r = s.get(u, timeout=30); print(n, r.status_code, len(r.content)); (out / n).write_bytes(r.content)
              except Exception as e: print(n, e)
          PY
          git config user.name probe; git config user.email probe@example.com
          git add raw2; git commit -qm probe-out3; git push

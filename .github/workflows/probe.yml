name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          i=0
          while read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1))
            curl -sS -L -m 30 -A "$UA" -H "Accept: application/json, text/html" -o out/$i.body -w "$i %{http_code} %{content_type} $u\n" "$u" >> out/index.txt 2>>out/err.txt || echo "$i FAIL $u" >> out/index.txt
          done <<'URLS'
          https://www.loteriasyapuestas.es/servicios/proximosv3?game_id=LAQU&num=2
          https://www.loteriasyapuestas.es/servicios/buscadorSorteos?game_id=LAQU&celebrados=false&fechaInicioInclusiva=20261020&fechaFinInclusiva=20261110
          https://www.loteriasyapuestas.es/servicios/buscadorSorteos?game_id=LAQU&celebrados=true&fechaInicioInclusiva=20260901&fechaFinInclusiva=20261025
          https://www.loteriasyapuestas.es/es/la-quiniela
          https://www.eduardolosilla.es/quiniela
          https://www.quinielista.es/
          https://www.combinacionganadora.com/quiniela/
          https://site.api.espn.com/apis/site/v2/sports/soccer/esp.2/scoreboard
          URLS
          for y in 0506 0607 0708 0809 0910 1011 1112 1213 1314 1415 1516 1617 1718 1819 1920 2021 2122 2223 2324 2425 2526 2627; do
            curl -sS -m 30 -A "$UA" -o out/SP2_$y.csv https://www.football-data.co.uk/mmz4281/$y/SP2.csv || true
            curl -sS -m 30 -A "$UA" -o out/SP1_$y.csv https://www.football-data.co.uk/mmz4281/$y/SP1.csv || true
          done
          curl -sS -m 30 -A "$UA" -o out/fixtures.csv https://www.football-data.co.uk/fixtures.csv || true
          git config user.name probe; git config user.email probe@example.com
          git add out; git commit -qm probe-out; git push

name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e mainrepo
      - run: |
          mkdir -p raw12
          cd mainrepo
          python - <<'PY' > ../raw12/out.txt 2>&1 || true
          import logging; logging.basicConfig(level=logging.INFO)
          from laliga.config import load_settings
          from laliga.data import shots
          s = load_settings()
          for y in range(2019, 2027):
              df = shots.fetch_shots(s, y, online=True, max_new=400)
              print(y, len(df), df.match_id.nunique())
          PY
          cp data/raw/understat/shots_*.csv ../raw12/ 2>/dev/null || true
          cd ..
          git config user.name probe; git config user.email probe@example.com
          git add raw12; git commit -qm probe-out12; git push origin HEAD:probe

name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . -q
      - run: |
          python - <<'PY'
          import logging; logging.basicConfig(level=logging.INFO)
          from laliga.config import load_settings
          from laliga import eurelo
          from laliga.data import results
          s = load_settings()
          for y in range(2024, 2027):
              results.fetch_season(s, y, online=True, div="SP2")
          r = eurelo.build(s, online=True)
          print(r.sort_values("rating", ascending=False).head(40).to_string())
          print(r.league.value_counts().to_string())
          PY
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git add -f data/raw/euro data/processed/euro_elo.csv data/raw/SP2_*.csv; git commit -qm probe-out5; git push origin HEAD:probe

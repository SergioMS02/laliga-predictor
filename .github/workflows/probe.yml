name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . -q
      - run: |
          python - <<'PY'
          import logging, time; logging.basicConfig(level=logging.INFO)
          from laliga.config import load_settings
          from laliga import eurelo
          s = load_settings()
          t = time.time()
          r = eurelo.build(s, online=True)
          print("time", time.time() - t)
          print(r.league.value_counts().to_string())
          print(r[r.league == "copa"].sort_values("n", ascending=False).head(40).to_string())
          print(r[r.team.str.endswith("(F)")].sort_values("rating", ascending=False).to_string())
          PY
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git add -f data/raw/euro data/processed/euro_elo.csv; git commit -qm probe-out7; git push origin HEAD:probe

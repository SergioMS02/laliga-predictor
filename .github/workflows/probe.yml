name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: mainrepo }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e mainrepo
      - run: |
          mkdir -p raw15
          cd mainrepo
          python - <<'PY' > ../raw15/out.txt 2>&1 || true
          from laliga.config import load_settings
          from laliga.data import news
          s = load_settings()
          for t in ["Barcelona", "Sevilla"]:
              items = news.fetch_team_news(s, t)
              print(t, len(items), [i.title[:70] for i in items[:3]])
          PY
          cd ..
          git config user.name probe; git config user.email probe@example.com
          git add raw15; git commit -qm probe-out15; git push origin HEAD:probe

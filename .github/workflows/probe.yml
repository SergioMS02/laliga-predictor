name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw6
          python3 - <<'PY' > raw6/out.txt 2>&1
          import requests, json
          s = requests.Session(); s.headers["User-Agent"] = "Mozilla/5.0 (X11; Linux x86_64) laliga-predictor/0.1"
          base = "https://site.api.espn.com/apis/site/v2/sports/soccer/{}/scoreboard"
          for lg in ["uefa.champions", "esp.w.1", "esp.1"]:
              for params in [{"dates": "20250901-20250930", "limit": 900}, {"dates": "20250901-20250930", "limit": 300}, {"dates": "20250916"}, {"dates": "20250901-20250930"}]:
                  r = s.get(base.format(lg), params=params, timeout=30)
                  try:
                      js = r.json(); ev = js.get("events", [])
                      print(lg, params, r.status_code, len(ev), ev[0]["competitions"][0]["status"]["type"]["completed"] if ev else None)
                  except Exception as e:
                      print(lg, params, r.status_code, "ERR", e, r.text[:200])
          PY
          git config user.name probe; git config user.email probe@example.com
          git add raw6; git commit -qm probe-out6; git push origin HEAD:probe

name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw4
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sS -A "$UA" -o raw4/sb.json "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard"
          curl -sS -D - -o /dev/null -A "$UA" -H "Origin: https://sergioms02.github.io" "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard" | grep -i -E "^HTTP|access-control|content-type" >> raw4/cors.txt
          EID=$(python3 -c "import json;d=json.load(open('raw4/sb.json'));print(d['events'][0]['id'])")
          curl -sS -A "$UA" -o raw4/summary.json "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/summary?event=$EID"
          echo "--- summary" >> raw4/cors.txt
          curl -sS -D - -o /dev/null -A "$UA" -H "Origin: https://sergioms02.github.io" "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/summary?event=$EID" | grep -i -E "^HTTP|access-control" >> raw4/cors.txt
          for u in "https://www.eduardolosilla.es/quiniela" "https://www.quinielista.es/" "https://www.eduardolosilla.es/quiniela/ayudas/porcentajes" "https://www.quinielista.es/porcentajes" "https://www.combinacionganadora.com/quiniela/probabilidades/"; do
            n=$(echo $u | md5sum | cut -c1-6); curl -sS -L -A "$UA" -o raw4/p_$n.html -w "$n %{http_code} $u\n" "$u" >> raw4/pages.txt
          done
          git config user.name probe; git config user.email probe@example.com
          git add raw4; git commit -qm probe-out4; git push origin HEAD:probe

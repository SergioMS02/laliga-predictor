name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw9
          python3 - <<'PY' > raw9/out.txt 2>&1
          import requests, json
          s = requests.Session(); s.headers["User-Agent"] = "Mozilla/5.0"
          G = "https://gamma-api.polymarket.com"
          for path, params in [("/sports", {}), ("/tags", {"limit": 500}),
                               ("/events", {"limit": 50, "closed": "false", "tag_slug": "la-liga"}),
                               ("/events", {"limit": 50, "closed": "false", "tag_slug": "laliga"}),
                               ("/events", {"limit": 50, "closed": "false", "series_slug": "la-liga"}),
                               ("/public-search", {"q": "Real Madrid", "limit_per_type": 20}),
                               ("/events", {"limit": 50, "closed": "true", "tag_slug": "la-liga", "order": "endDate", "ascending": "false"})]:
              try:
                  r = s.get(G + path, params=params, timeout=30)
                  print("==", path, params, r.status_code, len(r.content))
                  js = r.json()
                  open("raw9/" + (path.strip("/").replace("/", "_") + "_" + "_".join(f"{k}{v}" for k, v in params.items()))[:80] + ".json", "w").write(json.dumps(js)[:3000000])
                  if isinstance(js, list):
                      for e in js[:40]:
                          print("  ", {k: e.get(k) for k in ("id", "slug", "title", "label", "sport", "series", "volume", "endDate") if k in e})
                  elif isinstance(js, dict):
                      print("  keys", list(js)[:10])
                      for k in ("events", "markets"):
                          for e in (js.get(k) or [])[:20]:
                              print("   ", k, {kk: e.get(kk) for kk in ("slug", "title", "question", "volume", "endDate")})
              except Exception as e:
                  print("ERR", path, e)
          PY
          git config user.name probe; git config user.email probe@example.com
          git add raw9; git commit -qm probe-out9; git push origin HEAD:probe

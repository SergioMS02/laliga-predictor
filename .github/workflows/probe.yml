name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw13
          python3 - <<'PY' > raw13/out.txt 2>&1 || true
          import requests, json, re
          s = requests.Session(); s.headers["User-Agent"] = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          G = "https://gamma-api.polymarket.com"
          base = None
          js = s.get(G + "/events", params={"series_id": "10193", "closed": "false", "limit": 100}, timeout=40).json()
          slugs = [e["slug"] for e in js]
          mains = [x for x in slugs if re.fullmatch(r"lal-[a-z0-9]+-[a-z0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}", x)]
          print("mains", mains[:12])
          base = mains[0]
          for suf in ["", "-halftime-result", "-exact-score", "-first-to-score", "-total-corners", "-more-markets", "-player-props", "-second-half-result"]:
              ev = s.get(G + "/events", params={"slug": base + suf}, timeout=30).json()
              if not ev: print("NONE", suf); continue
              e = ev[0]
              print("\n==", base + suf, e.get("title"), round(e.get("volume") or 0), len(e.get("markets") or []))
              for m in (e.get("markets") or [])[:40]:
                  print("  ", repr(m.get("groupItemTitle")), "|", m.get("question"), "|", m.get("outcomes"), m.get("outcomePrices"), round(float(m.get("volumeNum") or 0)), m.get("sportsMarketType"), m.get("line"))
          # quinigol
          for u in ["https://www.combinacionganadora.com/quinigol/", "https://www.eduardolosilla.es/quinigol", "https://www.loteriasyapuestas.es/es/quinigol",
                    "https://www.transfermarkt.es/laliga/startseite/wettbewerb/ES1", "https://www.transfermarkt.com/laliga/startseite/wettbewerb/ES1"]:
              try:
                  r = s.get(u, timeout=30)
                  name = re.sub(r"[^a-z0-9]+", "_", u)[-40:]
                  open("raw13/" + name + ".html", "w").write(r.text[:400000])
                  print("URL", u, r.status_code, len(r.text))
              except Exception as ex:
                  print("URL", u, "ERR", ex)
          PY
          git config user.name probe; git config user.email probe@example.com
          git add raw13; git commit -qm probe-out13; git push origin HEAD:probe

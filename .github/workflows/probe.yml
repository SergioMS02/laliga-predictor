name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: mainrepo }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e mainrepo
      - run: |
          mkdir -p raw20
          cd mainrepo
          python - <<'PY' > ../raw20/out.txt 2>&1 || true
          import logging; logging.basicConfig(level=logging.INFO)
          from laliga import quiniela as q
          from laliga.config import load_settings
          pg = q.fetch_page(); print("CUR", pg and {k: pg[k] for k in ("date", "jornada", "prev", "next")}, pg and q._finished(pg))
          if pg and pg.get("prev"):
              p2 = q.fetch_page(pg["prev"]); print("PREV", p2 and {k: p2[k] for k in ("date", "jornada", "prev", "next")}, p2 and q._finished(p2), p2 and p2.get("prizes"))
          from laliga import quiniela_backtest as qb
          s = load_settings()
          pages = qb.collect(s, True, max_back=6); print("COLLECT", [(p["date"], p["jornada"]) for p in pages])
          if pages:
              v = qb.public_for(s, pages[0]["jornada"], None, True); print("PUB", v and {k: (v[k][:2] if isinstance(v[k], list) else v[k]) for k in v})
          PY
          cd ..
          git config user.name probe; git config user.email probe@example.com
          git add raw20; git commit -qm probe-out20; git push origin HEAD:probe

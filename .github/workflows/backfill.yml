name: Histórico de alineaciones

# Una sola vez (o cuando haga falta): descarga de ESPN las alineaciones y árbitros de temporadas
# pasadas, recalibra el efecto de las bajas y mide cuánto hay que mover las cuotas con el once.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Temporadas (año de inicio), p. ej. 2021-2025"
        default: "2021-2025"

permissions:
  contents: write

concurrency:
  group: laliga-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Alineaciones y árbitros
        run: python -m laliga backfill-espn --seasons "${{ inputs.seasons }}" --no-other -v
      - name: Backtest (tabla fuera de muestra)
        run: python -m laliga backtest -v
      - name: Calibrar bajas y peso del once
        run: python -m laliga calibrate-availability -v
      - name: Guardar
        run: |
          git config user.name "laliga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data predictions
          git diff --cached --quiet && exit 0
          git commit -m "Histórico de alineaciones ${{ inputs.seasons }}"
          git pull --rebase --autostash -X theirs
          git push

name: Predicciones

on:
  schedule:
    # Todos los días 06:17 UTC: actualizar datos y predecir los próximos 8 días
    - cron: "17 6 * * *"
    # Viernes a lunes, cada 20 min de 10:00 a 21:40 UTC: vigilar alineaciones oficiales
    - cron: "*/20 10-21 * * 5,6,0,1"
  workflow_dispatch:
    inputs:
      command:
        description: "Comando (predict | watch-lineups | all)"
        default: "predict"

permissions:
  contents: write

concurrency:
  group: laliga-data
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Elegir comando
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "c=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 6 * * *" ]; then
            echo "c=predict" >> "$GITHUB_OUTPUT"
          else
            echo "c=watch-lineups" >> "$GITHUB_OUTPUT"
          fi

      - name: Primera ejecución (sin modelo entrenado)
        if: hashFiles('data/state/stacker.pkl') == ''
        run: python -m laliga train -v

      - name: Ejecutar
        run: python -m laliga ${{ steps.cmd.outputs.c }} --notify -v

      - name: Guardar en el repositorio
        run: |
          git config user.name "laliga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data predictions
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Predicciones $(date -u '+%Y-%m-%d %H:%M') [${{ steps.cmd.outputs.c }}]"
          git pull --rebase --autostash
          git push

name: Predicciones

on:
  schedule:
    # Todos los días 06:17 UTC: actualizar datos y predecir los próximos 8 días
    - cron: "17 6 * * *"
    # Cada 20 min de 10:00 a 21:40 UTC: vigilar alineaciones oficiales (solo sigue si hay partido en < 2 h)
    - cron: "*/20 10-21 * * *"
    # Cada 30 min de 13:00 a 23:30 UTC: liquidar apuestas y quiniela al acabar los partidos
    - cron: "5,35 13-23 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Comando (predict | watch-lineups | settle | quiniela | all)"
        default: "predict"

permissions:
  contents: write

concurrency:
  group: laliga-data
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Elegir comando
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "c=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 6 * * *" ]; then
            echo "c=predict" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "5,35 13-23 * * *" ]; then
            echo "c=settle" >> "$GITHUB_OUTPUT"
          else
            echo "c=watch-lineups" >> "$GITHUB_OUTPUT"
          fi

      # Ahorro de tiempo: la vigilancia de alineaciones solo sigue si algún partido empieza en
      # menos de 2 horas sin alineación, y la liquidación solo si algún partido con apuesta
      # (o la quiniela) ya debería haber terminado. Sin instalar nada.
      - name: ¿Hay algo que hacer?
        id: gate
        run: |
          C="${{ steps.cmd.outputs.c }}"
          if [ "$C" != "watch-lineups" ] && [ "$C" != "settle" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          C="$C" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, os, datetime as dt, pathlib
          now = dt.datetime.now(dt.timezone.utc)
          go = False
          if os.environ["C"] == "watch-lineups":
              p = pathlib.Path("predictions/latest.json")
              for m in json.loads(p.read_text()) if p.exists() else []:
                  ko = m.get("kickoff_utc")
                  if ko and not m.get("lineup_confirmed"):
                      mins = (dt.datetime.fromisoformat(ko) - now).total_seconds() / 60
                      go |= -10 <= mins <= 120
          else:
              p = pathlib.Path("predictions/bets.csv")
              for r in csv.DictReader(p.open()) if p.exists() else []:
                  if r.get("status") == "pendiente" and r.get("kickoff_utc"):
                      mins = (now - dt.datetime.fromisoformat(r["kickoff_utc"])).total_seconds() / 60
                      go |= 110 <= mins <= 60 * 48
              q = pathlib.Path("predictions/quiniela.json")
              if q.exists():
                  for d, j in json.loads(q.read_text()).get("jornadas", {}).items():
                      go |= (not j.get("settled")) and d <= now.strftime("%Y-%m-%d") and now.hour >= 16
          print(f"go={'true' if go else 'false'}")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.go == 'true'
        run: pip install -e .

      - name: Primera ejecución (sin modelo entrenado)
        if: steps.gate.outputs.go == 'true' && hashFiles('data/state/stacker.pkl') == ''
        run: python -m laliga train -v

      - name: Ejecutar
        if: steps.gate.outputs.go == 'true'
        run: python -m laliga ${{ steps.cmd.outputs.c }} --notify -v

      - name: Guardar en el repositorio
        id: save
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "laliga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data predictions
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Predicciones $(date -u '+%Y-%m-%d %H:%M') [${{ steps.cmd.outputs.c }}]"
          git pull --rebase --autostash
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  web:
    needs: predict
    if: needs.predict.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
